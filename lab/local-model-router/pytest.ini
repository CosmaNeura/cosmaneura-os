[pytest]
# Lab-local collection so CI workflows need no change.
# Run: cd lab/local-model-router && uv run --project ../.. pytest -c pytest.ini -q
# Or from repo root:
#   uv run pytest -c lab/local-model-router/pytest.ini lab/local-model-router/tests -q
pythonpath = .
testpaths = tests
addopts = --import-mode=importlib -q
filterwarnings = ignore::DeprecationWarning
