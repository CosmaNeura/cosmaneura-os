<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">CosmaBot</title>
  <desc id="desc">A smiling face framed by a softly sculpted champagne-gold C, open at the right cheek, on Scribe's teal-to-navy background.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#146F6C"/><stop offset="1" stop-color="#17273C"/>
    </linearGradient>
    <linearGradient id="gold" x1="0.12" y1="0" x2="0.82" y2="1">
      <stop stop-color="#FFF2CA"/><stop offset=".28" stop-color="#F4DFA8"/>
      <stop offset=".60" stop-color="#E6CA88"/><stop offset=".82" stop-color="#CEAA63"/>
      <stop offset="1" stop-color="#F1DBA4"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2=".85" y2="1">
      <stop stop-color="#D5B477"/><stop offset="1" stop-color="#916832"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFF9E2" stop-opacity=".7"/>
      <stop offset=".6" stop-color="#FFF9E2" stop-opacity=".09"/>
      <stop offset="1" stop-color="#FFF9E2" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="eye" cx=".3" cy=".18" r=".9">
      <stop stop-color="#FFF8E0"/><stop offset=".5" stop-color="#F6E5B5"/><stop offset="1" stop-color="#D7B875"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="17" stdDeviation="13" flood-color="#061724" flood-opacity=".3"/>
    </filter>
    <filter id="face-shadow" x="-40%" y="-40%" width="180%" height="200%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#091B29" flood-opacity=".4"/>
    </filter>
    <path id="contour" d="M 777 371 A 300 300 0 1 0 777 629"/>
  </defs>
  <rect width="1024" height="1024" fill="url(#background)"/>
  <g filter="url(#shadow)" fill="none" stroke-linecap="round">
    <use href="#contour" stroke="url(#edge)" stroke-width="132" transform="translate(0 7)"/>
    <use href="#contour" stroke="url(#gold)" stroke-width="130"/>
    <use href="#contour" stroke="url(#light)" stroke-width="108" transform="translate(-3 -5)"/>
  </g>
  <g filter="url(#face-shadow)">
    <ellipse cx="413" cy="463" rx="31" ry="47" fill="url(#eye)" transform="rotate(-5 413 463)"/>
    <ellipse cx="584" cy="463" rx="31" ry="47" fill="url(#eye)" transform="rotate(5 584 463)"/>
    <path d="M 438 570 Q 500 632 562 570" fill="none" stroke="url(#gold)" stroke-width="27" stroke-linecap="round"/>
    <path d="M 441 567 Q 500 623 559 567" fill="none" stroke="#FFF2CA" stroke-opacity=".38" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
