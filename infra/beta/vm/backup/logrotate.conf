/var/log/cosmabot-backup/*.log /var/lib/cosmabot-backup/commands.log {
    daily
    maxsize 20M
    rotate 7
    missingok
    notifempty
    copytruncate
    su cosmabot-backup cosmabot-backup
}
/var/log/cosmabot-restore/*.log /var/lib/cosmabot-restore/commands.log {
    daily
    maxsize 20M
    rotate 2
    missingok
    notifempty
    copytruncate
    su cosmabot-restore cosmabot-restore
}
