services:
  postgres:
    image: postgres:16.9
    environment:
      POSTGRES_USER: cosmas
      POSTGRES_PASSWORD: cosmas
      POSTGRES_DB: cosmas_os
    ports:
      - "54329:5432"
    volumes:
      - cosmas_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cosmas -d cosmas_os"]
      interval: 2s
      timeout: 5s
      retries: 20

  redis:
    image: redis:6.2.18
    ports:
      - "63799:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn cosmas_os.api.app:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+psycopg://cosmas:cosmas@postgres:5432/cosmas_os
      REDIS_URL: redis://redis:6379/0
      COSMAS_ENV: synth_os
      BLOB_ROOT: /data/blobs
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - cosmas_blobs:/data/blobs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A cosmas_os.worker.celery_app worker --loglevel=INFO
    environment:
      DATABASE_URL: postgresql+psycopg://cosmas:cosmas@postgres:5432/cosmas_os
      REDIS_URL: redis://redis:6379/0
      COSMAS_ENV: synth_os
      BLOB_ROOT: /data/blobs
    volumes:
      - ./:/app
      - cosmas_blobs:/data/blobs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: node:24.19.0-alpine@sha256:d32cdf619f63fe0471182d08996dd516c6275bb5fd31ae06e55a570bd9e1ad43
    working_dir: /workspace
    command: sh -c "./scripts/install-client-deps.sh && cd web && corepack pnpm dev --host 0.0.0.0 --port 5173"
    environment:
      VITE_API_BASE: http://localhost:8000
      VITE_COSMAS_ENV: synth_os
    ports:
      - "5173:5173"
    volumes:
      - ./web:/workspace/web
      - ./clients:/workspace/clients:ro
      - ./scripts/install-client-deps.sh:/workspace/scripts/install-client-deps.sh:ro
      - cosmas_web_modules:/workspace/web/node_modules
      - cosmas_capture_modules:/workspace/clients/capture/node_modules
    depends_on:
      - api

volumes:
  cosmas_pg:
  cosmas_blobs:
  cosmas_web_modules:
  cosmas_capture_modules:

# Note: this host uses the `docker-compose` binary (not `docker compose`).
