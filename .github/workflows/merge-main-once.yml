name: merge-main-once
on:
  workflow_dispatch:
  push:
    branches:
      - cursor/resolve-214-never
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/forgot-password-clerk-06d2
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge main and resolve App.tsx deterministically
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit FETCH_HEAD >/dev/null 2>&1 || true
          echo "--- conflicted paths ---"
          git diff --name-only --diff-filter=U || true
          git checkout FETCH_HEAD -- web/src/App.tsx
          python3 - <<'PY'
          import pathlib
          import sys

          path = pathlib.Path("web/src/App.tsx")
          text = path.read_text()

          if "<<<<<<<" in text or ">>>>>>>" in text:
              sys.exit("unexpected conflict markers in main App.tsx")

          clerk_old = 'import { OrganizationSwitcher, SignIn, UserButton, useAuth, useClerk, useUser } from "@clerk/react";'
          clerk_new = 'import { OrganizationSwitcher, UserButton, useAuth, useClerk, useUser } from "@clerk/react";'
          if clerk_old in text:
              text = text.replace(clerk_old, clerk_new)

          if '<SignIn routing="hash" />' in text:
              text = text.replace('<SignIn routing="hash" />', "<BetaSignIn />")
          if "<BetaSignIn />" not in text:
              sys.exit("BetaSignIn not mounted")

          if "from \"./beta-sign-in\"" not in text:
              anchor = 'import { BetaIdentityAdmin } from "./BetaIdentityAdmin";'
              if anchor not in text:
                  sys.exit("BetaIdentityAdmin import anchor missing")
              text = text.replace(anchor, anchor + '\nimport { BetaSignIn } from "./beta-sign-in";')

          if "SignIn " in text and "<BetaSignIn" not in text:
              sys.exit("stale SignIn usage")
          if "SignIn" in text.replace("BetaSignIn", "") and "<SignIn" in text:
              sys.exit("SignIn still rendered")

          path.write_text(text)
          print("App.tsx resolved from main plus BetaSignIn")
          PY
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Merge main into forgot-password branch"
          fi
          git rm -q .github/workflows/merge-main-once.yml || true
          git commit -m "ci: remove one-shot merge helper" || true
          git push origin HEAD:cursor/forgot-password-clerk-06d2
          echo pushed
