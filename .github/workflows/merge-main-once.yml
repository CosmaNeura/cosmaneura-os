name: merge-main-once
on:
  push:
    branches:
      - cursor/visits-tabs-phone-type-06d2
  workflow_dispatch:
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/visits-tabs-phone-type-06d2
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge main and resolve conflicts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit FETCH_HEAD || true
          echo "--- status ---"
          git status --porcelain | head -30
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          path = pathlib.Path("web/src/VisitCatalog.tsx")
          text = path.read_text()
          text = re.sub(r"<<<<<<<[^\n]*\n.*?=======\n.*?>>>>>>>[^\n]*\n", "", text, flags=re.S)
          text = text.replace(
              "<nav className=\"team-material-tabs\" aria-label=\"Visit views\">",
              "<nav className=\"team-material-tabs visit-catalog-tabs\" aria-label=\"Visit views\">",
          )
          text = text.replace(
              "{['All','Today','Upcoming','Past',...visitsOnly?[]:['Unlinked notes']].map(label=>",
              "{(visitsOnly?VISIT_CATALOG_VIEWS.filter(label=>label!=='Unlinked notes'):VISIT_CATALOG_VIEWS).map(label=>",
          )
          if "VISIT_CATALOG_VIEWS=" not in text:
              text = text.replace(
                  "export function VisitCatalog(",
                  "export const VISIT_CATALOG_VIEWS=['All','Today','Upcoming','Past','Unlinked notes'] as const;\n\nexport function VisitCatalog(",
                  1,
              )
          if "import './visit-catalog.css';" not in text:
              text = text.replace(
                  "import type {NotebookSummaries} from './notebook-metadata-contract';",
                  "import type {NotebookSummaries} from './notebook-metadata-contract';\nimport './visit-catalog.css';",
                  1,
              )
          path.write_text(text)
          if "<<<<<<<" in text or ">>>>>>>" in text:
              sys.exit("markers remain in VisitCatalog.tsx")
          if "visit-catalog-tabs" not in text:
              sys.exit("visit-catalog-tabs class missing")
          if "VISIT_CATALOG_VIEWS" not in text:
              sys.exit("VISIT_CATALOG_VIEWS missing")
          print("VisitCatalog resolved")
          PY
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Merge main into visits tabs branch"
          fi
          git rm -q .github/workflows/merge-main-once.yml || true
          git commit -m "ci: remove one-shot merge helper" || true
          git push origin HEAD:cursor/visits-tabs-phone-type-06d2
          echo pushed
