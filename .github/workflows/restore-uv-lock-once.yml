name: restore-uv-lock-once
on:
  push:
    branches: [cursor/forgot-password-clerk-06d2]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/forgot-password-clerk-06d2
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore uv.lock from main
        run: |
          git fetch origin main
          git show origin/main:uv.lock > uv.lock
          test -s uv.lock
          grep -q 'pypdf-6.21.2' uv.lock
          rm -f .cursor-agent-size-probe.txt
          rm -f .github/workflows/restore-uv-lock-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'nothing to commit'
            exit 0
          fi
          git commit -m 'fix(deps): restore uv.lock with pypdf 6.21.2 from main'
          git push origin HEAD:cursor/forgot-password-clerk-06d2
