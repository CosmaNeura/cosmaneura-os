name: apply-messages-fix-once
on:
  push:
    branches: [cursor/messages-journey-wait-06d2]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apply-messages-fix
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      PATCH_B64: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/messages-journey-wait-06d2
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply verified patch
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/fix.patch
          wc -c /tmp/fix.patch
          head -1 /tmp/fix.patch
          git apply --3way /tmp/fix.patch
          echo "--- verifying every Messages journey has the timeout ---"
          missing=0
          for f in web/src/Messages*Journey.test.tsx; do
            if ! grep -q 'vi.setConfig({testTimeout: MESSAGES_JOURNEY_TEST_TIMEOUT_MS})' "$f"; then
              echo "MISSING: $f"; missing=1
            fi
          done
          test "$missing" -eq 0
          rm -f .github/workflows/apply-messages-fix-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then echo 'nothing to commit'; exit 0; fi
          git commit -m 'test(web): give Messages journeys a real timeout and fix two race waits'
          git push origin HEAD:cursor/messages-journey-wait-06d2
