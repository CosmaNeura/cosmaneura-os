name: repair-efax-final
on:
  push:
    branches:
      - cursor/efax-syntax-repair-06d2
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: repair-efax-final
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/efax-syntax-repair-06d2
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Rebuild MessagesEFaxJourney from main plus repairs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git show origin/main:web/src/MessagesEFaxJourney.test.tsx > web/src/MessagesEFaxJourney.test.tsx
          python3 - <<'PY'
          import pathlib
          import sys

          path = pathlib.Path("web/src/MessagesEFaxJourney.test.tsx")
          text = path.read_text()

          # 1. Replace literal backslash-u-2039 escapes with the real character.
          text = text.replace("\\u2039", "\u2039")

          # 2. Repair each wait(...) line whose parens do not balance.
          out = []
          repaired = 0
          for line in text.splitlines(True):
              if line.lstrip().startswith("await") and "await wait(()=>expect(" in line:
                  body = line.rstrip("\n")
                  balance = body.count("(") - body.count(")")
                  while balance > 0:
                      body += ")"
                      balance -= 1
                      repaired += 1
                  if not body.endswith(";"):
                      body += ";"
                  line = body + "\n"
              out.append(line)
          text = "".join(out)

          # 3. Keep the intended polled assertion.
          old = "expect(question().value).toMatch(/^Keep existing Chief directions\\.\\n\\n/);expect(passage()).toBeUndefined();"
          new = "expect(question().value).toMatch(/^Keep existing Chief directions\\.\\n\\n/);await wait(()=>expect(passage()).toBeUndefined());"
          if old in text:
              text = text.replace(old, new)
              repaired += 1

          path.write_text(text)

          lines = text.splitlines()
          checks = {
              "no literal escapes": "\\u2039" not in text,
              "no conflict markers": "<<<<<<<" not in text and ">>>>>>>" not in text,
              "no placeholder": "REPLACE_SENTINEL" not in text,
              "has real back char": "\u2039" in text,
              "wait fix present": "await wait(()=>expect(passage()).toBeUndefined())" in text,
          }
          unbalanced = [i + 1 for i, l in enumerate(lines) if "await wait(()=>expect(" in l and l.count("(") - l.count(")") != 0]
          checks["all wait lines balanced"] = not unbalanced
          for name, ok in checks.items():
              print(("OK   " if ok else "FAIL ") + name)
          print("parens added:", repaired)
          if unbalanced:
              print("unbalanced lines:", unbalanced)
          if not all(checks.values()):
              sys.exit("repair verification failed")
          PY
          rm -f .github/workflows/repair-efax-final.yml
          git add -A
          git commit -m "fix(web): rebuild EFax journey from main with syntax repairs" || true
          git push origin HEAD:cursor/efax-syntax-repair-06d2
          echo pushed
