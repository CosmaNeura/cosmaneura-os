name: restore-uv-lock-214-final

on:
  push:
    branches: [cursor/forgot-password-clerk-06d2]
    paths: [.github/workflows/restore-uv-lock-214-final.yml]

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Restore canonical uv.lock blob and remove this workflow
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'cursor/forgot-password-clerk-06d2';
            const workflowPath = '.github/workflows/restore-uv-lock-214-final.yml';
            const blobSha = '9c26ab551c43b8ec06582720357bd13e3a1b284f';
            const { data: ref } = await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
            const headSha = ref.object.sha;
            const { data: headCommit } = await github.rest.git.getCommit({ owner, repo, commit_sha: headSha });
            const { data: newTree } = await github.rest.git.createTree({
              owner,
              repo,
              base_tree: headCommit.tree.sha,
              tree: [
                { path: 'uv.lock', mode: '100644', type: 'blob', sha: blobSha },
                { path: workflowPath, mode: '100644', type: 'blob', sha: null },
              ],
            });
            const { data: newCommit } = await github.rest.git.createCommit({
              owner,
              repo,
              message: 'fix(deps): restore uv.lock with pypdf 6.21.2 from main',
              tree: newTree.sha,
              parents: [headSha],
            });
            await github.rest.git.updateRef({ owner, repo, ref: `heads/${branch}`, sha: newCommit.sha });
            core.info(`Updated ${branch} to ${newCommit.sha}`);
